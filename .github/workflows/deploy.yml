name: Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'certs/appstore/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 배포는 하나씩 끝까지 진행한다. 대기는 가장 최근 push 하나만 남아 최신 main이 배포된다
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: deepple-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::339713092351:role/deepple-github-image-push
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # ECR 태그는 덮어쓸 수 없으므로 같은 커밋을 다시 실행하면 이미 push된 이미지를 쓴다
      - id: existing
        run: |
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 서명된 증명을 따로 붙이므로 buildx 기본 증명은 끈다
      - id: push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.push.outputs.digest }}
        run: |
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: dev
      url: https://dev-api.deepple.co.kr
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::339713092351:role/deepple-dev-deploy
          aws-region: ${{ env.AWS_REGION }}

      # task definition은 Terraform이 처음 만들고 이후에는 이미지만 바꿔 새 revision으로 등록한다
      - name: Download task definition
        run: aws ecs describe-task-definition --task-definition deepple-dev --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ needs.build.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: deepple-dev
          service: deepple-dev-api
          wait-for-service-stability: true
          # 새 task가 3번 실패해 ECS가 배포 실패를 선언할 때까지 기다린다 (한 번에 4~5분)
          wait-for-minutes: 25

      # 실패는 ECS 배포 이벤트가 따로 알린다
      - name: Notify
        continue-on-error: true
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
        run: |
          message=$(jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg author "$COMMIT_AUTHOR" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source: "deepple.deploy", environment: "dev", commit: $commit, message: $message, url: $url, author: $author, time: $time}')
          aws sns publish \
            --topic-arn "arn:aws:sns:${AWS_REGION}:339713092351:deepple-dev-alerts" \
            --message "$message"
