plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.gradle.git.properties)
}

group = 'deepple'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom libs.spring.cloud.aws.bom.get().toString()
        mavenBom libs.sentry.bom.get().toString()
    }
    // 다른 라이브러리가 끌어오는 취약한 버전을 고친 버전으로 올린다. 상위 라이브러리가 이 버전 이상을 쓰면 지운다
    // guava: CVE-2026-102554 (Google 라이브러리), bcprov: CVE-2026-8763·CVE-2026-13506 (app-store-server-library)
    dependencies {
        dependency libs.guava.get().toString()
        dependency libs.bouncycastle.bcprov.get().toString()
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.querydsl.jpa
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jpa') }

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation libs.redisson.spring.boot.starter

    // Auth
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // External - AWS
    implementation libs.spring.cloud.aws.starter.s3

    // External - Firebase
    implementation libs.firebase.admin

    // External - App Store, Google Play
    implementation libs.app.store.server
    implementation libs.google.androidpublisher
    implementation libs.google.auth

    // Resilience
    implementation libs.resilience4j.spring.boot

    // API Docs
    implementation libs.springdoc.webmvc.ui

    // Observability
    implementation 'org.hibernate.orm:hibernate-micrometer'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation libs.opentelemetry.logback.appender
    implementation libs.sentry.spring.boot
    implementation libs.sentry.logback

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Local
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gitProperties {
    keys = ['git.commit.id', 'git.commit.time', 'git.branch']
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named("jar") {
    enabled = false
}
