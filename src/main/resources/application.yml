spring:
  application:
    name: deepple-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: optional:classpath:git.properties

  jackson:
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
    time-zone: Asia/Seoul

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

management:
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${spring.profiles.active}
      service.version: ${git.commit.id:unknown}
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    ecs:
      service:
        environment: ${spring.profiles.active}
        version: ${git.commit.id:unknown}

sentry:
  environment: ${spring.profiles.active}
  data-collection:
    user-info: false
    cookies:
      mode: "off"
    http-headers:
      request:
        mode: deny-list
        terms: forwarded,-ip,remote-,via,-user
