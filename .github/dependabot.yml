version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    # 탈취된 새 버전이 자동 병합되지 않도록 공개 후 7일이 지난 버전만 올린다
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types: [ minor, patch ]
    commit-message:
      prefix: chore
    labels: [ infra ]

  # 자동 병합하지 않고 직접 확인한다
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      gradle:
        update-types: [ minor, patch ]
    commit-message:
      prefix: chore
    labels: [ ]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [ version-update:semver-major ]
    groups:
      docker:
        patterns: [ "*" ]
    commit-message:
      prefix: chore
    labels: [ infra ]
