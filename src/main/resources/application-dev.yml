spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

jwt:
  refresh-token:
    expiration: 2592000  # 30일

auth:
  refresh-token-cookie:
    max-age: 2592000  # 30일

payment:
  app-store:
    environment: Sandbox
    base-url: https://api.storekit-sandbox.itunes.apple.com
