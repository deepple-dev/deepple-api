spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 20
      connection-timeout: 3000

  data:
    redis:
      cluster:
        nodes: ${REDIS_HOST}:6379
      ssl:
        enabled: true

  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  issuer: https://api.deepple.co.kr

auth:
  refresh-token:
    cookie:
      same-site: Lax

cors:
  allowed-origins:
    - https://admin.deepple.co.kr

payment:
  app-store:
    environment: Production

storage:
  public-url: https://images.deepple.co.kr
