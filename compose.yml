name: deepple

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: deepple
      MYSQL_USER: deepple
      MYSQL_PASSWORD: deepple
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.11
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: deepple-local
    ports:
      - "9090:9090"

  otel-lgtm:
    image: grafana/otel-lgtm:0.39.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql-data:
