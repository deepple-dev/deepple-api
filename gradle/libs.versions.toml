[versions]
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
spring-cloud-aws = "4.2.1"
spring-modulith = "2.1.1"
querydsl = "7.7"
redisson = "4.8.0"
shedlock = "7.11.0"
firebase-admin = "9.11.0"
app-store-server = "5.2.0"
google-androidpublisher = "v3-rev20261026-2.9.2"
google-auth = "1.55.0"
resilience4j = "2.4.0"
springdoc = "3.2.0"
guava = "33.7.2-jre"
bouncycastle = "1.86"
sentry = "8.62.0"
gradle-git-properties = "4.0.1"
spotless = "8.11.0"
opentelemetry-logback-appender = "2.28.0-alpha"
archunit = "1.4.2"

[libraries]
spring-cloud-aws-bom = { module = "io.awspring.cloud:spring-cloud-aws-dependencies", version.ref = "spring-cloud-aws" }
spring-cloud-aws-starter-s3 = { module = "io.awspring.cloud:spring-cloud-aws-starter-s3" }

spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-modulith-api = { module = "org.springframework.modulith:spring-modulith-api" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-starter-jpa = { module = "org.springframework.modulith:spring-modulith-starter-jpa" }

archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

querydsl-jpa = { module = "io.github.openfeign.querydsl:querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { module = "io.github.openfeign.querydsl:querydsl-apt", version.ref = "querydsl" }


redisson-spring-boot-starter = { module = "org.redisson:redisson-spring-boot-starter", version.ref = "redisson" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-provider-redis-spring = { module = "net.javacrumbs.shedlock:shedlock-provider-redis-spring", version.ref = "shedlock" }
firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
app-store-server = { module = "com.apple.itunes.storekit:app-store-server-library", version.ref = "app-store-server" }
google-androidpublisher = { module = "com.google.apis:google-api-services-androidpublisher", version.ref = "google-androidpublisher" }
google-auth = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "google-auth" }
resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

sentry-bom = { module = "io.sentry:sentry-bom", version.ref = "sentry" }
sentry-spring-boot = { module = "io.sentry:sentry-spring-boot-4" }
sentry-logback = { module = "io.sentry:sentry-logback" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
gradle-git-properties = { id = "com.gorylenko.gradle-git-properties", version.ref = "gradle-git-properties" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
