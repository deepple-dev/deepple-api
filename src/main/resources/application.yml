spring:
  application:
    name: deepple-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: optional:classpath:git.properties

  modulith:
    events:
      staleness:
        published: 5m
        processing: 5m
        resubmitted: 5m

  jackson:
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
    time-zone: Asia/Seoul

  datasource:
    hikari:
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 3
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 5000

  data:
    redis:
      connect-timeout: 2s
      timeout: 1s

  cache:
    type: redis
    redis:
      time-to-live: 1h
      key-prefix: "cache:v2::"

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true

  cloud:
    aws:
      region:
        static: ap-northeast-2

management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${spring.profiles.active}
      service.version: ${git.commit.id:unknown}
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,3s
  tracing:
    sampling:
      probability: 1.0

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${spring.profiles.active}
        version: ${git.commit.id:unknown}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

sentry:
  environment: ${spring.profiles.active}
  data-collection:
    user-info: false
    cookies:
      mode: "off"
    http-headers:
      request:
        mode: deny-list
        terms: forwarded,-ip,remote-,via,-user

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  access-token-lifetime: 30m

auth:
  refresh-token:
    lifetime: 30d
    cookie:
      name: refresh_token
      path: /
      same-site: None
      secure: true
      http-only: true

payment:
  app-store:
    bundle-id: com.goodmeet.deepple
    app-apple-id: ${APP_STORE_APP_APPLE_ID}
    root-ca-paths: /etc/certs/appstore/AppleRootCA-G2.pem, /etc/certs/appstore/AppleRootCA-G3.pem
  google-play:
    package-name: com.goodmeet.deepple
    service-account: ${GOOGLE_PLAY_SERVICE_ACCOUNT}
    application-name: deepple-api
    connect-timeout: 3s
    read-timeout: 5s

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  service-account: ${FIREBASE_SERVICE_ACCOUNT}
  connect-timeout: 5s
  read-timeout: 2s
  write-timeout: 5s

google:
  workload-identity:
    audience: ${GOOGLE_WORKLOAD_IDENTITY_AUDIENCE}

bizgo:
  api-url: ${BIZGO_API_URL}
  api-key: ${BIZGO_API_KEY}
  from-phone-number: ${BIZGO_FROM_PHONE_NUMBER}

scheduler:
  cron: "0 0 0 * * *"
  event-resubmission-cron: "0 * * * * *"
  member-account-purge-cron: "0 0 0 * * *"
