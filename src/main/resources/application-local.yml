spring:
  datasource:
    url: jdbc:mysql://localhost:3306/deepple
    username: deepple
    password: deepple

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      lifecycle-management: start-only

  cloud:
    aws:
      credentials:
        access-key: local
        secret-key: local
      s3:
        endpoint: http://localhost:9090
        path-style-access-enabled: true
        bucket: deepple-local

jwt:
  secret: this-is-secret-key-value-at-least-128-bytes
  refresh-token:
    expiration: 1209600  # 2주

auth:
  refresh-token-cookie:
    max-age: 2419200  # 4주
  prefix-code: 008008

cors:
  allowed-origins:
    - https://localhost:8080

payment:
  app-store:
    environment: Sandbox
    app-apple-id: 0
    root-ca-paths: certs/appstore/AppleRootCA-G2.pem, certs/appstore/AppleRootCA-G3.pem
  google-play:
    enabled: false

firebase:
  enabled: false

bizgo:
  enabled: false
