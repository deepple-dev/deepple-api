spring:
  profiles:
    active: test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/test-migration

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        path-style-access-enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      enabled: false

jwt:
  secret: this-is-secret-key-value-at-least-128-bytes
  access-token:
    expiration: 1800  # 30분
  refresh-token:
    expiration: 1209600  # 2주

auth:
  refresh-token-cookie:
    name: refresh_token
    max-age: 2419200  # 4주
    path: /
    same-site: None
    secure: true
    http-only: true
  prefix-code: 008008

cors:
  allowed-origins:
    - https://admin.deepple.test

payment:
  app-store:
    bundle-id: "com.example.myapp"
    environment: "Sandbox"
    app-apple-id: 0000000000
    root-ca-paths: certs/appstore/AppleRootCA-G2.pem,certs/appstore/AppleRootCA-G3.pem
  google-play:
    enabled: false

firebase:
  enabled: false

bizgo:
  enabled: false

scheduler:
  cron: "0 0 0 * * *"
