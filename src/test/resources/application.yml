spring:
  profiles:
    active: test

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/test-migration

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: test
        secret-key: test
      s3:
        path-style-access-enabled: true

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false
  logging:
    export:
      enabled: false

