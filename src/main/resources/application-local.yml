spring:
  datasource:
    url: jdbc:mysql://localhost:3306/deepple
    username: deepple
    password: deepple
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        jdbc:
          timezone: Asia/Seoul

  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history

  docker:
    compose:
      lifecycle-management: start-only

  cloud:
    aws:
      region:
        static: ap-northeast-2
      credentials:
        access-key: local
        secret-key: local
      s3:
        endpoint: http://localhost:9090
        path-style-access-enabled: true
        bucket: deepple-local

logging:
  level:
    root: info

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 50MB

jwt:
  secret: this-is-secret-key-value-at-least-128-bytes
  access-token:
    expiration: 1800  # 30분
  refresh-token:
    expiration: 1209600  # 2주

auth:
  refresh-token-cookie:
    name: refresh_token
    max-age: 2419200  # 4주
    path: /
    same-site: None
    secure: true
    http-only: true
  prefix-code: 008008

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

payment:
  app-store:
    key-id: key-id
    private-key-string: private-key-string
    issuer-id: issuer-id
    environment: Sandbox
    bundle-id: bundle-id
    app-apple-id: 0
    root-ca-paths: certs/appstore/AppleRootCA-G2.pem, certs/appstore/AppleRootCA-G3.pem
    base-url: https://api.storekit-sandbox.itunes.apple.com
  google-play:
    enabled: false

bizgo:
  enabled: false

firebase:
  enabled: false

scheduler:
  cron: "0 0 0 * * *"
