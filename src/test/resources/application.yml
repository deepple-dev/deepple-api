    lifetime: 30d
    cookie:
      name: refresh_token
      path: /
      same-site: None
      secure: true
      http-only: true

cors:
  allowed-origins:
    - https://admin.deepple.test

payment:
  app-store:
    bundle-id: "com.example.myapp"
    environment: "Sandbox"
    app-apple-id: 0000000000
    root-ca-paths: certs/appstore/AppleRootCA-G2.pem,certs/appstore/AppleRootCA-G3.pem
  google-play:
    enabled: false

firebase:
  enabled: false

bizgo:
  enabled: false

scheduler:
  cron: "0 0 0 * * *"
